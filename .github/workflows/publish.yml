name: Build and publish package
on:
  workflow_dispatch:
    inputs:
      destination:
        description: Package index (configure its trusted publisher first)
        required: true
        type: choice
        default: testpypi
        options: [testpypi, pypi]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - run: python -m unittest discover -s tests -v
      - name: Require a matching version tag for production
        if: inputs.destination == 'pypi'
        env:
          RELEASE_REF: ${{ github.ref }}
        run: python -c "import os, proofml; assert os.environ['RELEASE_REF'] == 'refs/tags/v' + proofml.__version__, 'Run production publishing from the matching version tag'"
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_distribution.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.destination }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: inputs.destination == 'testpypi'
        with:
          repository-url: https://test.pypi.org/legacy/
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: inputs.destination == 'pypi'
