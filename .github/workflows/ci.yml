name: Test and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: proofml demo --output demo-report --fail-on none
      - run: proofml demo --clean --output clean-report
      - run: proofml demo --problem forecasting --output forecast-report --fail-on none
      - run: proofml demo --problem forecasting --clean --output forecast-clean-report
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}-${{ matrix.python }}
          path: demo-report/
  parquet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[parquet]'
      - run: python -m unittest discover -s tests -v
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - run: python scripts/check_distribution.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: proofml-wheel
          path: dist/*
